refresh_data:
  name: "Refresh EufyLife Data"
  description: "Manually trigger a data refresh for debugging purposes"
  fields:
    entity_id:
      name: "Entity ID"
      description: "Target a specific EufyLife sensor (optional)"
      required: false
      selector:
        entity:
          domain: sensor
          integration: eufylife_api

set_light_settings:
  name: "Set Light Settings"
  description: "Advanced control for E10 lights including segmented colors, speed and direction."
  target:
    entity:
      domain: light
      integration: eufylife_api
  fields:
    effect:
      name: "Effect"
      description: "Name of a preset effect to apply."
      selector:
        text:
    colors:
      name: "Colors"
      description: "List of colors for each lamp segment. Use 3-tuple [R,G,B] or 5-tuple [R,G,B,W,C]."
      selector:
        object:
    speed:
      name: "Speed"
      description: "Animation speed (1 to 10)."
      selector:
        number:
          min: 1
          max: 10
          mode: box
    direction:
      name: "Direction"
      description: "Animation direction (0 or 1)."
      selector:
        number:
          min: 0
          max: 1
          mode: box

set_light_show:
  name: "Set Light Show Animation"
  description: "Send a custom JSON animation payload to E10 lights."
  target:
    entity:
      domain: light
      integration: eufylife_api
  fields:
    params:
      name: "Parameters"
      description: "JSON string containing lightShow or animation parameters (layers, speeds, colors)."
      required: true
      selector:
        text:
          multiline: true
    use_ai_opcode:
      name: "Use AI Opcode"
      description: "Send via AI opcode 0211 instead of 0210 (legacy)."
      required: false
      selector:
        boolean:

set_scene:
  name: "Set Scene"
  description: "Trigger a cloud scene by numeric scene ID (Opcode 0202)."
  target:
    entity:
      domain: light
      integration: eufylife_api
  fields:
    scene_id:
      name: "Scene ID"
      description: "Numeric ID of the scene."
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box